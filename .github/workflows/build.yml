name: Build and Package

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Recreate google-services.json (Optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ ! -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android_app/app/google-services.json
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 secret not set, skipping step."
          fi

      - name: Verify google-services.json
        run: |
          if [ -f android_app/app/google-services.json ]; then
            echo "SUCCESS: google-services.json successfully recreated!"
            echo "File size: $(wc -c < android_app/app/google-services.json) bytes."
          else
            echo "WARNING: google-services.json was not found."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x android_app/gradlew

      - name: Build with Gradle
        run: |
          cd android_app
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android_app/app/build/outputs/apk/debug/app-debug.apk

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'windows_agent/requirements.txt'

      - name: Recreate .env file (Optional)
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
        shell: bash
        run: |
          if [ ! -z "$ENV_FILE_CONTENT" ]; then
            echo "$ENV_FILE_CONTENT" > windows_agent/.env
          else
            echo "ENV_FILE_CONTENT secret not set, skipping step."
          fi

      - name: Install dependencies
        run: |
          cd windows_agent
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows Executable
        run: |
          cd windows_agent
          pyinstaller --clean DeviceLink.spec

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: DeviceLink-exe
          path: windows_agent/dist/DeviceLink.exe

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: release-artifacts

      - name: Download Windows Executable
        uses: actions/download-artifact@v4
        with:
          name: DeviceLink-exe
          path: release-artifacts

      - name: Rename artifacts for release
        run: |
          mv release-artifacts/app-debug.apk release-artifacts/DeviceLink-Companion.apk
          mv release-artifacts/DeviceLink.exe release-artifacts/DeviceLink-Windows.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/DeviceLink-Companion.apk
            release-artifacts/DeviceLink-Windows.exe
          draft: false
          prerelease: false
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
