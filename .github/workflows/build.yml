name: Build and Package

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Recreate google-services.json (Optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ ! -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android_app/app/google-services.json
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 secret not set, skipping step."
          fi

      - name: Verify google-services.json
        run: |
          if [ -f android_app/app/google-services.json ]; then
            echo "SUCCESS: google-services.json successfully recreated!"
            echo "File size: $(wc -c < android_app/app/google-services.json) bytes."
          else
            echo "WARNING: google-services.json was not found."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x android_app/gradlew

      - name: Set Android version from release tag
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            if [[ ! "$VERSION_NAME" =~ ^(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]]; then
              echo "Release tags must use the vMAJOR.MINOR.PATCH format." >&2
              exit 1
            fi
            IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
            if (( MAJOR > 2147 || MINOR > 999 || PATCH > 999 )); then
              echo "Release tag version is outside the supported Android versionCode range." >&2
              exit 1
            fi
            VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          else
            VERSION_NAME="1.6.4"
            VERSION_CODE="3"
          fi
          echo "ANDROID_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Build with Gradle
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android_app/release-keystore.jks
        run: |
          set -euo pipefail
          trap 'rm -f "$GITHUB_WORKSPACE/android_app/release-keystore.jks"' EXIT
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD repository secrets." >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android_app/release-keystore.jks
          cd android_app
          ./gradlew assembleRelease

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android_app/app/build/outputs/apk/release/app-release.apk

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'windows_agent/requirements.txt'

      - name: Recreate .env file (Optional)
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE_CONTENT }}
        shell: bash
        run: |
          if [ ! -z "$ENV_FILE_CONTENT" ]; then
            echo "$ENV_FILE_CONTENT" > windows_agent/.env
          else
            echo "ENV_FILE_CONTENT secret not set, skipping step."
          fi

      - name: Install dependencies
        run: |
          cd windows_agent
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows Executable
        run: |
          cd windows_agent
          pyinstaller --clean DeviceLink.spec

      - name: Upload Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: DeviceLink-exe
          path: windows_agent/dist/DeviceLink.exe

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: release-artifacts

      - name: Download Windows Executable
        uses: actions/download-artifact@v4
        with:
          name: DeviceLink-exe
          path: release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/app-release.apk
            release-artifacts/DeviceLink.exe
          draft: false
          prerelease: false
          overwrite: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
